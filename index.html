<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Images</title>
    <link rel="stylesheet" href="style/normalize.css">
    <link rel="stylesheet" href="style/style.css">

<body>
    <main>
        <h1>My SVG Images</h1>

        <!-- First image: SVG drawn directly inside HTML -->
        <section>
            <h2>YouTube Play Button</h2>

            <!-- Drawing area: 512 × 512 units -->
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="300"
                height="300"
                viewBox="0 0 512 512">
                aria-label="YouTube play button"
            >
            <!-- Red background with rounded corners -->
                <rect
                x="0"
                y="65"
                width="512"
                height="385"
                rx="80"
                fill="#e33228"
                />
            <!-- White triangle made from three points -->
            <polygon
                points="194,167 362,264 194,359"
                fill="white"
                />

            </svg>
        </section>

        <!-- Second image: SVG stored in a separate file -->
        <section>
            <h2>Credit Card</h2>

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="300"
                height="300"
                viewBox="0 0 512 512"
                role="img"
                aria-label="Credit card"
            >
                <!-- Display the symbol named credit-card
                     from the file Image/credit-card.svg -->
                <use href="Image/credit-card.svg#credit-card"></use>
            </svg>
        </section>
    </main>
</html>
