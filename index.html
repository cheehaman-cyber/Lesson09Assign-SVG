<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Images</title>

    <link rel="stylesheet" href="style/normalize.css">
    <link rel="stylesheet" href="style/style.css">

<body>
    <main>
        <h1>My SVG Images</h1>
        <section>
            <h2>YouTube Play Button</h2>

            <svg
                width="300"
                height="300"
                viewBox="0 0 512 512">
            
                <rect
                x="0"
                y="65"
                width="512"
                height="385"
                rx="80"
                fill="#e33228"/>
            <polygon
                points="194,167 362,264 194,359"
                fill="white"
                />
            </svg>
        </section>

        <section>
            <h2>Credit Card</h2>

            <svg
                width="300"
                height="300"
                viewBox="0 0 512 512"
                role="img"
                aria-label="Credit card">

                <use href="Image/credit-card.svg#credit-card"></use>
                <circle
                    cx="353"
                    cy="345"
                    r="53"
                    fill="#e51b0b"/>

                <circle
                    cx="415"
                    cy="345"
                    r="53"
                    fill="#2862a6"/>

                <rect
                    x="44"
                    y="230"
                    width="97"
                    height="18"
                    rx="9"
                    fill="#ffecaa"
                />

                <rect
                    x="159"
                    y="230"
                    width="97"
                    height="18"
                    rx="9"
                    fill="#ffecaa"
                />

                <rect x="44"  y="274" width="27" height="18" rx="9" fill="#ffecaa" />
                <rect x="88"  y="274" width="35" height="18" rx="9" fill="#ffecaa" />
                <rect x="141" y="274" width="27" height="18" rx="9" fill="#ffecaa" />
                <rect x="185" y="274" width="36" height="18" rx="9" fill="#ffecaa" />
                <rect x="238" y="274" width="18" height="18" rx="9" fill="#ffecaa" />
            </svg>
        </section>
    </main>
    
</body>
</html>
